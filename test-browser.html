<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Browser Test - Skills Way</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .test-result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .test-pass { background: #d4edda; color: #155724; }
        .test-fail { background: #f8d7da; color: #721c24; }
        .browser-info { background: #e2e3e5; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1><i class="fas fa-globe me-2"></i>Cross-Browser Compatibility Test</h1>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Browser Information</h5>
                    </div>
                    <div class="card-body">
                        <div class="browser-info">
                            <div id="browser-details"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Feature Support</h5>
                    </div>
                    <div class="card-body">
                        <div id="feature-tests"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>CSS & JavaScript Tests</h5>
                    </div>
                    <div class="card-body">
                        <div id="css-js-tests"></div>
                        
                        <!-- Test Elements -->
                        <div class="d-none">
                            <div id="flexbox-test" style="display: flex;"></div>
                            <div id="grid-test" style="display: grid;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Form & Input Tests</h5>
                    </div>
                    <div class="card-body">
                        <form id="test-form">
                            <div class="row">
                                <div class="col-md-4">
                                    <input type="email" class="form-control mb-2" placeholder="Email test">
                                    <input type="tel" class="form-control mb-2" placeholder="Phone test">
                                    <input type="date" class="form-control mb-2">
                                </div>
                                <div class="col-md-4">
                                    <select class="form-select mb-2">
                                        <option>Select test</option>
                                    </select>
                                    <input type="range" class="form-range mb-2">
                                    <input type="color" class="form-control mb-2">
                                </div>
                                <div class="col-md-4">
                                    <button type="button" class="btn btn-primary mb-2" onclick="testAjax()">AJAX Test</button>
                                    <button type="button" class="btn btn-success mb-2" onclick="testLocalStorage()">Storage Test</button>
                                    <div id="ajax-result"></div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Browser Detection
        function detectBrowser() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari')) browser = 'Safari';
            else if (ua.includes('Edge')) browser = 'Edge';
            else if (ua.includes('Opera')) browser = 'Opera';
            
            return {
                name: browser,
                version: ua.match(/(?:Chrome|Firefox|Safari|Edge|Opera)\/(\d+)/)?.[1] || 'Unknown',
                userAgent: ua,
                platform: navigator.platform,
                language: navigator.language,
                cookieEnabled: navigator.cookieEnabled,
                onLine: navigator.onLine
            };
        }
        
        // Feature Tests
        function runFeatureTests() {
            const tests = [
                { name: 'Local Storage', test: () => typeof(Storage) !== 'undefined' },
                { name: 'Session Storage', test: () => typeof(sessionStorage) !== 'undefined' },
                { name: 'Geolocation', test: () => 'geolocation' in navigator },
                { name: 'Canvas', test: () => !!document.createElement('canvas').getContext },
                { name: 'WebGL', test: () => !!document.createElement('canvas').getContext('webgl') },
                { name: 'Fetch API', test: () => 'fetch' in window },
                { name: 'Promise', test: () => 'Promise' in window },
                { name: 'Arrow Functions', test: () => { try { eval('()=>{}'); return true; } catch(e) { return false; } } },
                { name: 'CSS Grid', test: () => CSS.supports('display', 'grid') },
                { name: 'CSS Flexbox', test: () => CSS.supports('display', 'flex') },
                { name: 'CSS Variables', test: () => CSS.supports('--test', 'red') }
            ];
            
            return tests.map(test => ({
                name: test.name,
                supported: test.test()
            }));
        }
        
        // CSS Tests
        function runCSSTests() {
            const tests = [
                { name: 'Flexbox Layout', test: () => getComputedStyle(document.getElementById('flexbox-test')).display === 'flex' },
                { name: 'Grid Layout', test: () => getComputedStyle(document.getElementById('grid-test')).display === 'grid' },
                { name: 'Bootstrap CSS', test: () => !!document.querySelector('link[href*="bootstrap"]') },
                { name: 'Font Awesome', test: () => !!document.querySelector('link[href*="font-awesome"]') }
            ];
            
            return tests.map(test => ({
                name: test.name,
                supported: test.test()
            }));
        }
        
        // AJAX Test
        function testAjax() {
            fetch('test-ajax.php', { method: 'POST', body: 'test=1' })
                .then(response => response.text())
                .then(data => {
                    document.getElementById('ajax-result').innerHTML = 
                        '<div class="test-result test-pass">AJAX: Working</div>';
                })
                .catch(error => {
                    document.getElementById('ajax-result').innerHTML = 
                        '<div class="test-result test-fail">AJAX: Failed</div>';
                });
        }
        
        // Local Storage Test
        function testLocalStorage() {
            try {
                localStorage.setItem('test', 'value');
                localStorage.removeItem('test');
                document.getElementById('ajax-result').innerHTML += 
                    '<div class="test-result test-pass">Storage: Working</div>';
            } catch(e) {
                document.getElementById('ajax-result').innerHTML += 
                    '<div class="test-result test-fail">Storage: Failed</div>';
            }
        }
        
        // Display Results
        function displayResults() {
            const browser = detectBrowser();
            const features = runFeatureTests();
            const cssTests = runCSSTests();
            
            // Browser Info
            document.getElementById('browser-details').innerHTML = `
                <strong>Browser:</strong> ${browser.name} ${browser.version}<br>
                <strong>Platform:</strong> ${browser.platform}<br>
                <strong>Language:</strong> ${browser.language}<br>
                <strong>Cookies:</strong> ${browser.cookieEnabled ? 'Enabled' : 'Disabled'}<br>
                <strong>Online:</strong> ${browser.onLine ? 'Yes' : 'No'}
            `;
            
            // Feature Tests
            document.getElementById('feature-tests').innerHTML = features.map(feature => 
                `<div class="test-result ${feature.supported ? 'test-pass' : 'test-fail'}">
                    ${feature.name}: ${feature.supported ? 'Supported' : 'Not Supported'}
                </div>`
            ).join('');
            
            // CSS Tests
            document.getElementById('css-js-tests').innerHTML = cssTests.map(test => 
                `<div class="test-result ${test.supported ? 'test-pass' : 'test-fail'}">
                    ${test.name}: ${test.supported ? 'Working' : 'Failed'}
                </div>`
            ).join('');
        }
        
        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', displayResults);
    </script>
</body>
</html>
